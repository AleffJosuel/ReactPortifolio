<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="TypeScript, Node e Express">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="1" stop-color="#141b2d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#e2e8f0" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="460" fill="url(#bg)"/>
  <rect width="1200" height="460" fill="url(#dots)"/>
  <ellipse cx="600" cy="230" rx="520" ry="300" fill="url(#glow)"/>

  <!-- TypeScript tile -->
  <g transform="translate(300 150)">
    <rect width="160" height="160" rx="26" fill="#3178c6"/>
    <text x="150" y="130" text-anchor="end" font-family="'Space Grotesk','Segoe UI',sans-serif" font-weight="700" font-size="86" fill="#ffffff" letter-spacing="-2">TS</text>
  </g>

  <!-- plus -->
  <g fill="#e2e8f0" fill-opacity="0.9">
    <rect x="536" y="222" width="48" height="16" rx="8"/>
    <rect x="552" y="206" width="16" height="48" rx="8"/>
  </g>

  <!-- Node / Express badge -->
  <g transform="translate(640 150)">
    <rect width="260" height="160" rx="26" fill="#131826" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="2"/>
    <text x="130" y="86" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',sans-serif" font-weight="700" font-size="40" fill="#e2e8f0">Node</text>
    <text x="130" y="126" text-anchor="middle" font-family="'Inter','Segoe UI',sans-serif" font-weight="500" font-size="26" fill="#22d3ee">Express</text>
  </g>

  <!-- caption -->
  <text x="600" y="390" text-anchor="middle" font-family="'Inter','Segoe UI',sans-serif" font-weight="600" font-size="30" fill="#94a3b8" letter-spacing="1">Full Stack · servidor do zero</text>
</svg>
