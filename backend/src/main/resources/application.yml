server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: portfolio
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  github:
    username: ${GITHUB_USERNAME:AleffJosuel}
    cache-ttl-minutes: ${GITHUB_CACHE_TTL_MINUTES:15}
  admin:
    token: ${ADMIN_TOKEN}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
